# HenriWorks · job que publica os modelos liberados pela política do Copilot.
#
# Vai num repositório INTERNO do time de plataforma (não nos repositórios de produto), em
# .github/workflows/modelos-liberados.yml. Cada dev lê o JSON publicado com:
#   node .henriworks/bin/modelos.mjs atualizar --de gh:<org>/<este-repo>/modelos-liberados.json
#
# Credencial: um GitHub App instalado só neste repositório e na org, com a permissão mínima que a
# API de política exige. Confira na referência antes de criar o App:
#   org:        GET /orgs/{org}/copilot/model-policies          (owner da org; permissão de administração da org)
#   enterprise: GET /enterprises/{ent}/copilot/model-policies   (papel read_enterprise_ai_controls; "Enterprise AI controls: read")
# Se o banco usa enterprise, prefira o escopo enterprise: a permissão de leitura é bem mais estreita.
#
# Variáveis do repositório: HWK_ESCOPO (org | enterprise), HWK_ALVO (nome da org ou da enterprise),
# HWK_APP_ID. Segredo: HWK_APP_KEY. Se a política do banco exige action fixada por SHA, troque @v1/@v4.

name: Modelos liberados do Copilot

on:
  schedule:
    - cron: '17 9 * * 1-5'   # dias úteis, 06:17 em Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency: modelos-liberados

jobs:
  publicar:
    runs-on: ubuntu-latest   # ou o runner interno do banco
    steps:
      - uses: actions/checkout@v4

      - id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.HWK_APP_ID }}
          private-key: ${{ secrets.HWK_APP_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Ler a política
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ESCOPO: ${{ vars.HWK_ESCOPO }}
          ALVO: ${{ vars.HWK_ALVO }}
        run: |
          set -euo pipefail
          case "$ESCOPO" in
            org) rota="/orgs/$ALVO/copilot/model-policies" ;;
            enterprise) rota="/enterprises/$ALVO/copilot/model-policies" ;;
            *) echo "HWK_ESCOPO precisa ser org ou enterprise" >&2; exit 1 ;;
          esac
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "$rota" > politica.json
          # Formato mudou? Falha aqui, antes de publicar lixo.
          jq -e '.models | type == "array" and length > 0' politica.json > /dev/null
          jq --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg e "$ESCOPO:$ALVO" \
            '{obtidoEm: $t, escopo: $e, politica: .}' politica.json > novo.json

      - name: Publicar se mudou (ou a cada 5 dias, para a lista não vencer)
        shell: bash
        run: |
          set -euo pipefail
          arq=modelos-liberados.json
          if [ -f "$arq" ]; then
            mesma=$(cmp -s <(jq -S .politica "$arq") <(jq -S .politica novo.json) && echo sim || echo nao)
            idade=$(( ( $(date -u +%s) - $(date -u -d "$(jq -r .obtidoEm "$arq")" +%s) ) / 86400 ))
            if [ "$mesma" = sim ] && [ "$idade" -lt 5 ]; then echo "sem mudança (lista com $idade dia(s))"; exit 0; fi
          fi
          mv novo.json "$arq"
          git config user.name "hwk-modelos"
          git config user.email "hwk-modelos@users.noreply.github.com"
          git add "$arq"
          git commit -m "chore(copilot): atualiza modelos liberados"
          git push

<rect width="900" height="426" rx="0" fill="#0b0b1e"/><g class="rise" style="animation-delay:0.10s"><rect x="8" y="4" width="284" height="122" rx="0" fill="#14143a" stroke="#2a2a6a" stroke-width="2"/><rect x="8" y="4" width="284" height="4" rx="0" fill="#ff2e97"/><text x="28" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#ff2e97" font-weight="700">01</text><text x="28" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16.5" fill="#f4f4ff" font-weight="700">/hwk-start</text><text x="28" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8a8ac0">Agente hwk. Diz a rota:</text><text x="28" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8a8ac0">direto, discovery ou plano.</text></g><g class="rise" style="animation-delay:0.20s"><rect x="308" y="4" width="284" height="122" rx="0" fill="#14143a" stroke="#2a2a6a" stroke-width="2"/><rect x="308" y="4" width="284" height="4" rx="0" fill="#00e5ff"/><text x="328" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#00e5ff" font-weight="700">02</text><text x="328" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16.5" fill="#f4f4ff" font-weight="700">/hwk-grill</text><text x="328" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8a8ac0">Entrevista até ter um briefing</text><text x="328" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8a8ac0">sem lacuna bloqueante.</text></g><g class="rise" style="animation-delay:0.30s"><rect x="608" y="4" width="284" height="122" rx="0" fill="#14143a" stroke="#2a2a6a" stroke-width="2"/><rect x="608" y="4" width="284" height="4" rx="0" fill="#ffe600"/><text x="628" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#ffe600" font-weight="700">03</text><text x="628" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16.5" fill="#f4f4ff" font-weight="700">/hwk-plan</text><text x="628" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8a8ac0">Proposta, rigor Lite ou Full,</text><text x="628" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8a8ac0">e uma fatia por arquivo.</text></g><g class="rise" style="animation-delay:0.40s"><rect x="8" y="142" width="284" height="122" rx="0" fill="#14143a" stroke="#2a2a6a" stroke-width="2"/><rect x="8" y="142" width="284" height="4" rx="0" fill="#ff2e97"/><text x="28" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#ff2e97" font-weight="700">04</text><text x="28" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16.5" fill="#f4f4ff" font-weight="700">/hwk-review</text><text x="28" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8a8ac0">Revisão por peixinhos sem a</text><text x="28" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8a8ac0">conversa: spec ou 3 eixos.</text></g><g class="rise" style="animation-delay:0.50s"><rect x="308" y="142" width="284" height="122" rx="0" fill="#14143a" stroke="#2a2a6a" stroke-width="2"/><rect x="308" y="142" width="284" height="4" rx="0" fill="#00e5ff"/><text x="328" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#00e5ff" font-weight="700">05</text><text x="328" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16.5" fill="#f4f4ff" font-weight="700">/hwk-implement</text><text x="328" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8a8ac0">Uma fatia por sessão, ou</text><text x="328" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8a8ac0">várias em paralelo.</text></g><g class="rise" style="animation-delay:0.60s"><rect x="608" y="142" width="284" height="122" rx="0" fill="#14143a" stroke="#2a2a6a" stroke-width="2"/><rect x="608" y="142" width="284" height="4" rx="0" fill="#ffe600"/><text x="628" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#ffe600" font-weight="700">06</text><text x="628" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16.5" fill="#f4f4ff" font-weight="700">/hwk-archive</text><text x="628" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8a8ac0">Gera o resumo.md, corpo da PR,</text><text x="628" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8a8ac0">e arquiva.</text></g><g class="rise" style="animation-delay:0.70s"><rect x="8" y="280" width="284" height="140" rx="0" fill="#14143a" stroke="#2a2a6a" stroke-width="2"/><rect x="8" y="280" width="284" height="4" rx="0" fill="#ff2e97"/><text x="28" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#ff2e97" font-weight="700">07</text><text x="28" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16.5" fill="#f4f4ff" font-weight="700">/hwk-fechar</text><text x="28" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8a8ac0">Cria o registro em</text><text x="28" y="386" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8a8ac0">conhecimento/, o único</text><text x="28" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8a8ac0">commitado.</text></g><g class="rise" style="animation-delay:0.80s"><rect x="308" y="280" width="284" height="140" rx="0" fill="#14143a" stroke="#2a2a6a" stroke-width="2"/><rect x="308" y="280" width="284" height="4" rx="0" fill="#00e5ff"/><text x="328" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#00e5ff" font-weight="700">08</text><text x="328" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16.5" fill="#f4f4ff" font-weight="700">/hwk-canario</text><text x="328" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8a8ac0">Prova o isolamento do revisor</text><text x="328" y="386" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8a8ac0">e os hooks.</text></g><g class="rise" style="animation-delay:0.90s"><rect x="608" y="280" width="284" height="140" rx="0" fill="#14143a" stroke="#2a2a6a" stroke-width="2"/><rect x="608" y="280" width="284" height="4" rx="0" fill="#ffe600"/><text x="628" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#ffe600" font-weight="700">09</text><text x="628" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16.5" fill="#f4f4ff" font-weight="700">/hwk-mapa</text><text x="628" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8a8ac0">Onde fica e o que quebra,</text><text x="628" y="386" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8a8ac0">antes de buscar.</text></g>
